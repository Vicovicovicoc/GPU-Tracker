name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The existing repository has legacy Prettier formatting violations.
      # Keep ESLint's correctness rules active without forcing an unrelated
      # whole-repository formatting rewrite in this feature branch.
      - name: Lint
        run: bun run lint -- --rule 'prettier/prettier: off'

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
